name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # 22 must be the latest 22.x: it runs the TypeScript sources without a flag.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - run: npm ci
      - run: npx biome ci
      - run: npx tsc --noEmit
      - run: npm test
      # The only test of the paths the compiled output resolves: fonts, theme, wasm.
      - name: Smoke-test the packed tarball
        if: matrix.node == 24
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npx --yes ./camille-hdl-hill-chart-*.tgz < "$GITHUB_WORKSPACE/test/fixtures/sample.json" > sample.svg
          grep -q '<svg' sample.svg
          npx --yes ./camille-hdl-hill-chart-*.tgz "$GITHUB_WORKSPACE/test/fixtures/sample.json" -o sample.png
          test "$(file --brief --mime-type sample.png)" = image/png
